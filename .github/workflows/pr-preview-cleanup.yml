name: PR preview cleanup

# When a PR is closed or merged, delete the preview namespace.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  teardown:
    name: delete-namespace
    runs-on: fifa-runners
    timeout-minutes: 5
    steps:
      - name: Delete the preview namespace
        run: |
          set -euo pipefail
          NS="myapp-pr-${{ github.event.pull_request.number }}"
          if kubectl get namespace "${NS}" >/dev/null 2>&1; then
            kubectl delete namespace "${NS}" --wait=true --timeout=120s
            echo "Deleted namespace ${NS}"
          else
            echo "Namespace ${NS} did not exist. Nothing to do."
          fi

      - name: Comment cleanup result
        uses: actions/github-script@v7
        with:
          script: |
            const ns = `myapp-pr-${context.payload.pull_request.number}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview namespace \`${ns}\` torn down.`,
            });
