# ---------------------------------------------------------------------------
# Auth types
# ---------------------------------------------------------------------------

"""
A registered API user. Passwords are never exposed - only the id, username,
and role are returned after a successful login or registration.
"""
type AuthUser {
  id: ID!
  username: String!
  role: UserRole!
}

"""
Tokens returned after a successful login or token refresh.

Access token:
  - Short-lived (default 15 min).
  - Send as `Authorization: Bearer <accessToken>` on every protected request.
  - Stateless JWT - the server validates the signature without a DB lookup.

Refresh token:
  - Long-lived (default 7 days).
  - Store securely (HttpOnly cookie or secure storage - never localStorage).
  - Call `refreshToken` mutation to get a new access token when it expires.
  - Single-use: each refresh rotates to a new refresh token (old one is revoked).
"""
type TokenPair {
  accessToken: String!
  refreshToken: String!
  "Seconds until the access token expires."
  accessTokenExpiresIn: Int!
  "Seconds until the refresh token expires."
  refreshTokenExpiresIn: Int!
}

"""
Payload returned by login, register and refreshToken mutations.
On success: tokenPair and user are populated, errors is empty.
On failure: tokenPair and user are null, errors carries the reason.
"""
type AuthPayload {
  tokenPair: TokenPair
  user: AuthUser
  errors: [UserError!]!
  meta: OperationMeta!
}

"""Payload returned by the logout mutation."""
type LogoutPayload {
  "True if the refresh token was successfully revoked."
  success: Boolean!
  errors: [UserError!]!
  meta: OperationMeta!
}

"""
Payload returned by the `me` query.
Returns the currently authenticated user or a NOT_FOUND/UNAUTHORIZED error.
"""
type MePayload {
  user: AuthUser
  errors: [UserError!]!
  meta: OperationMeta!
}

# ---------------------------------------------------------------------------
# Auth input types
# ---------------------------------------------------------------------------

input RegisterInput {
  username: String!
  "Must be at least 8 characters and contain a number."
  password: String!
  "Defaults to USER. Only an ADMIN can grant the ADMIN role."
  role: UserRole = USER
}

input LoginInput {
  username: String!
  password: String!
}

# ---------------------------------------------------------------------------
# Error and operation-metadata types
# ---------------------------------------------------------------------------

"""
A single error that occurred during a query or mutation.
Every error carries a machine-readable `code` and `category` so clients
can branch programmatically without parsing the human-readable `message`.
"""
type UserError {
  "Human-readable message suitable for display in a UI."
  message: String!

  """
  Dot-separated path to the offending input field.
  Examples: 'input.age', 'input.technical.finishing'
  Null for non-field errors (e.g. NOT_FOUND, SERVER_ERROR).
  """
  field: String

  "Machine-readable error code (maps to an HTTP status)."
  code: ErrorCode!

  "HTTP status-range category for quick client-side branching."
  category: ErrorCategory!

  """
  Present on MOVED_PERMANENTLY / TEMPORARY_REDIRECT / PERMANENT_REDIRECT.
  Contains the player ID or resource path the client should use instead.
  """
  redirectTarget: String
}

"""
Metadata attached to every operation outcome - both successes and failures.
Lets clients inspect the HTTP-equivalent result without parsing errors[].
"""
type OperationMeta {
  "HTTP-equivalent numeric status code (200, 201, 404, 503, etc.)."
  httpStatus: Int!

  "Machine-readable result code."
  code: ErrorCode!

  "HTTP status-range category."
  category: ErrorCategory!

  """
  Standard HTTP status phrase matching httpStatus.
  Examples: 'OK', 'Created', 'Not Found', 'Unprocessable Entity'.
  """
  statusMessage: String!

  "ISO-8601 UTC timestamp of when the operation completed on the server."
  timestamp: String!

  """
  Present on 3xx outcomes.
  The player ID or resource path the client should redirect to.
  """
  redirectTarget: String

  """
  Present on TOO_MANY_REQUESTS (429).
  Number of seconds the client should wait before retrying.
  """
  retryAfterSeconds: Int
}

# ---------------------------------------------------------------------------
# Payload wrapper types
# ---------------------------------------------------------------------------
# Rules:
# - Mutations always return a Payload with meta + errors.
# - Single-item queries return a QueryPayload (404 is meaningful).
# - List queries carry meta directly on the Connection type.
# - HTTP transport is always 200; status semantics live in meta.code.
# ---------------------------------------------------------------------------

"""
Payload for createPlayer and updatePlayer mutations.

2xx success:
  { player: {...}, errors: [], meta: { httpStatus: 201, code: CREATED, ... } }

4xx validation failure:
  { player: null, errors: [{ message: "Age must be 15 - 50", field: "input.age",
    code: UNPROCESSABLE_ENTITY, category: CLIENT_ERROR }],
    meta: { httpStatus: 422, code: UNPROCESSABLE_ENTITY, ... } }

5xx server failure:
  { player: null, errors: [{ message: "Database unavailable",
    code: SERVICE_UNAVAILABLE, category: SERVER_ERROR }],
    meta: { httpStatus: 503, code: SERVICE_UNAVAILABLE, ... } }
"""
type PlayerMutationPayload {
  "Non-null on 2xx success."
  player: Player
  "Non-empty on any error. Empty on success."
  errors: [UserError!]!
  "Always present. Inspect meta.code for the outcome."
  meta: OperationMeta!
}

"""
Payload for the deletePlayer mutation.

204 success: { deletedPlayerId: "123", errors: [], meta: { httpStatus: 204, code: NO_CONTENT } }
404 not found: { deletedPlayerId: null, errors: [{ code: NOT_FOUND, ... }],
                 meta: { httpStatus: 404, code: NOT_FOUND, ... } }
"""
type DeletePlayerPayload {
  "ID of the deleted player. Null when no matching record was found."
  deletedPlayerId: ID
  errors: [UserError!]!
  meta: OperationMeta!
}

"""
Payload for the player(id) single-item query.

200 found: { player: {...}, errors: [], meta: { httpStatus: 200, code: OK } }
404 missing: { player: null, errors: [{ code: NOT_FOUND, category: CLIENT_ERROR, ... }],
                meta: { httpStatus: 404, code: NOT_FOUND } }
301 redirect: { player: null, errors: [{ code: MOVED_PERMANENTLY,
                redirectTarget: "player-456", ... }],
                meta: { httpStatus: 301, code: MOVED_PERMANENTLY,
                redirectTarget: "player-456" } }
"""
type PlayerQueryPayload {
  "Non-null when the player exists and no redirect applies."
  player: Player
  errors: [UserError!]!
  meta: OperationMeta!
}

# ---------------------------------------------------------------------------
# Root Query
# ---------------------------------------------------------------------------

type Query {
  """
  Returns the currently authenticated user decoded from the Bearer token.
  Requires a valid access token in the Authorization header.
  meta.code: OK (200) | UNAUTHORIZED (401) | NOT_FOUND (404)
  """
  me: MePayload!

  """
  Fetch a single player by their unique ID.
  Returns PlayerQueryPayload so callers can inspect meta.code for:
    OK (200), NOT_FOUND (404), MOVED_PERMANENTLY (301), UNAUTHORIZED (401).
  """
  player(id: ID!): PlayerQueryPayload!

  """
  Paginated, filterable, multi-key-sortable player list.

  Depth ceiling (server enforces depth limit of 6):
    Query(1) -> PlayerConnection(2) -> edges(3) -> Player(4) -> SkillGroup(5) -> scalar(6)

  Page size cap: 100 rows per request.

  Example - top 10 Brazilian attackers sorted by finishing then name:
    players(
      filter: { countries: ["Brazil"], technical: { finishing: { min: 75 } } }
      sort: [{ field: FINISHING, direction: DESC }, { field: NAME, direction: ASC }]
      pagination: { first: 10 }
    )
  """
  players(
    filter: PlayerFilterInput
    sort: [PlayerSortInput!]
    pagination: PaginationInput
  ): PlayerConnection!

  """
  Top N players ranked by aggregate score within a skill category.
  Useful for leaderboards. Capped at 50 results.
  Accepts an optional filter to scope the leaderboard (e.g. by country or club).
  """
  topPlayers(
    category: SkillCategory!
    filter: PlayerFilterInput
    limit: Int = 10
  ): [Player!]!

  """
  Paginated, filterable, sortable list of clubs derived from player data.

  Example - Brazilian clubs with 5+ players, sorted by average rating:
    clubs(
      filter: { country: "Brazil", playerCount: { min: 5 } }
      sort: { field: AVERAGE_OVERALL_RATING, direction: DESC }
      pagination: { first: 20 }
    )
  """
  clubs(
    filter: ClubFilterInput
    sort: ClubSortInput
    pagination: PaginationInput
  ): ClubConnection!

  """
  All distinct country names present in the dataset (135 values).
  Returns a plain sorted list - small enough that pagination is not needed.
  Pass `nameContains` to filter the list client-side without a round-trip.
  """
  countries(nameContains: String): [String!]!
}

# ---------------------------------------------------------------------------
# Root Mutation
# ---------------------------------------------------------------------------

type Mutation {
  """
  Register a new API user account.
  - Any caller may register with role USER (no token required).
  - Granting the ADMIN role requires a valid ADMIN token.
  Success -> meta.code: CREATED (201)
  Duplicate username -> meta.code: CONFLICT (409)
  Weak password -> meta.code: UNPROCESSABLE_ENTITY (422)
  Role escalation without ADMIN token -> meta.code: FORBIDDEN (403)
  """
  register(input: RegisterInput!): AuthPayload!

  """
  Exchange username + password for an access token and a refresh token.
  Success -> meta.code: OK (200)
  Wrong credentials -> meta.code: UNAUTHORIZED (401)
  """
  login(input: LoginInput!): AuthPayload!

  """
  Exchange a valid refresh token for a new token pair (access + refresh).
  The supplied refresh token is immediately revoked (single-use rotation).
  Success -> meta.code: OK (200)
  Expired or already-used token -> meta.code: UNAUTHORIZED (401)
  """
  refreshToken(token: String!): AuthPayload!

  """
  Revoke the supplied refresh token, effectively logging out that session.
  Success -> meta.code: NO_CONTENT (204)
  Token not found -> meta.code: NOT_FOUND (404)
  """
  logout(refreshToken: String!): LogoutPayload!

  """
  Register a new player with all required stats.
  Requires role: ADMIN
  Success -> meta.code: CREATED (201)
  Duplicate -> meta.code: CONFLICT (409)
  Invalid input -> meta.code: UNPROCESSABLE_ENTITY (422)
  Auth failure -> meta.code: UNAUTHORIZED (401) or FORBIDDEN (403)
  """
  createPlayer(input: CreatePlayerInput!): PlayerMutationPayload!

  """
  Partially update an existing player's data.
  Requires role: ADMIN
  Success -> meta.code: OK (200)
