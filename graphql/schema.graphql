# =============================================================================
# FIFA Player Stats - GraphQL Schema
# =============================================================================
# Design principles enforced:
# 1. All field names are camelCase, descriptive and domain-accurate
# 2. Skill stats are grouped into shallow value-object types (1 level deep)
# to avoid a 40-field flat type - NOT separate entities with their own
# resolvers, so no N+1 risk and no circular nesting
# 3. Every list query uses cursor-based Relay-style Connection pagination
# 4. Mutations use dedicated Input types - never raw scalars for multi-field ops
# 5. Mutations return Payload wrapper types so errors are in-band
# 6. No Player.club.players or Player.country.players reverse edges -
# those cross-references are surfaced only through top-level queries,
# keeping max query depth at 6
# =============================================================================

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

"""
A monetary value in USD, stored as a float.
Raw CSV values like "$1.400.000" are normalised to a Float on ingest.
"""
scalar Currency

"""Opaque cursor string used for keyset pagination."""
scalar Cursor

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

"""
Every field on Player (including all 34 skill ratings) that can be used
as a sort key. Use multiple PlayerSortInput entries for tiebreaker sorts.
"""
enum PlayerSortField {
  # Identity / bio
  NAME
  AGE
  HEIGHT_CM
  WEIGHT_KG
  MARKET_VALUE
  OVERALL_RATING

  # Technical skills
  BALL_CONTROL
  DRIBBLING
  ATTACKING_POSITION
  FINISHING
  SHOT_POWER
  LONG_SHOTS
  VOLLEYS
  CURVE
  FREE_KICK_ACCURACY
  PENALTIES
  CROSSING
  SHORT_PASSING
  LONG_PASSING
  VISION

  # Defensive skills
  MARKING
  SLIDE_TACKLE
  STANDING_TACKLE
  INTERCEPTIONS
  AGGRESSION

  # Physical attributes
  ACCELERATION
  SPRINT_SPEED
  AGILITY
  BALANCE
  STAMINA
  STRENGTH
  JUMPING
  HEADING
  REACTIONS
  COMPOSURE

  # Goalkeeper skills
  GK_POSITIONING
  GK_DIVING
  GK_HANDLING
  GK_KICKING
  GK_REFLEXES
}

"""Sort direction."""
enum SortDirection {
  ASC
  DESC
}

"""
Skill category used when querying top-ranked players.
Maps directly to the four skill value-object types on Player.
"""
enum SkillCategory {
  TECHNICAL
  DEFENSIVE
  PHYSICAL
  GOALKEEPER
}

"""
Role assigned to a registered user.
Controls which mutations they are permitted to execute.
"""
enum UserRole {
  "Full access: read, create, update and delete players."
  ADMIN
  "Read-only access. Player mutations (create / update / delete) return FORBIDDEN."
  USER
}

"""Sort key for the clubs list."""
enum ClubSortField {
  NAME
  PLAYER_COUNT
  AVERAGE_AGE
  AVERAGE_OVERALL_RATING
}

"""
Which HTTP status-code range an operation outcome belongs to.
Present on every OperationMeta and UserError so clients can branch
on category without parsing numeric codes.
"""
enum ErrorCategory {
  "2xx - the operation succeeded."
  SUCCESS
  "3xx - the resource has moved; client should follow redirectTarget."
  REDIRECTION
  "4xx - the client sent a bad or unauthorised request."
  CLIENT_ERROR
  "5xx - the server failed; the client may retry."
  SERVER_ERROR
}

"""
Machine-readable operation result code. Each value maps to a specific
HTTP status code documented in the inline description.
"""
enum ErrorCode {
  # 2xx Success
  "200 - Read succeeded or update applied."
  OK
  "201 - New resource was created (createPlayer)."
  CREATED
  "202 - Request accepted for async processing."
  ACCEPTED
  "204 - Delete succeeded; no body returned."
  NO_CONTENT

  # 3xx Redirection
  "301 - Resource permanently moved to redirectTarget (e.g. merged player record)."
  MOVED_PERMANENTLY
  "307 - Temporary redirect; repeat the request at redirectTarget."
  TEMPORARY_REDIRECT
  "308 - Permanent redirect; update all future references to redirectTarget."
  PERMANENT_REDIRECT

  # 4xx Client Error
  "400 - Malformed query or structurally invalid input."
  BAD_REQUEST
  "401 - Request lacks valid authentication credentials."
  UNAUTHORIZED
  "403 - Authenticated but not authorised for this operation."
  FORBIDDEN
  "404 - The requested player or resource does not exist."
  NOT_FOUND
  "409 - Conflict, e.g. a player with the same name already exists at this club."
  CONFLICT
  "410 - Resource existed but has been permanently deleted."
  GONE
  "422 - Input is structurally valid but fails business-logic validation (e.g. age out of range)."
  UNPROCESSABLE_ENTITY
  "429 - Rate limit exceeded; see OperationMeta.retryAfterSeconds."
  TOO_MANY_REQUESTS

  # 5xx Server Error
  "500 - Unexpected server-side failure."
  INTERNAL_SERVER_ERROR
  "501 - The requested feature is not yet implemented."
  NOT_IMPLEMENTED
  "502 - An upstream dependency returned an invalid response."
  BAD_GATEWAY
  "503 - Server or database is temporarily unavailable; safe to retry."
  SERVICE_UNAVAILABLE
  "504 - Upstream dependency did not respond in time."
  GATEWAY_TIMEOUT
}

# ---------------------------------------------------------------------------
# Value-object types (not entities - no id, no top-level query of their own)
# ---------------------------------------------------------------------------

"""
Outfield attacking and creative skills.
All values are FIFA ratings 0 - 99.
"""
type TechnicalSkills {
  ballControl: Int!
  dribbling: Int!
  attackingPosition: Int!
  finishing: Int!
  shotPower: Int!
  longShots: Int!
  volleys: Int!
  curve: Int!
  freeKickAccuracy: Int!
  penalties: Int!
  crossing: Int!
  shortPassing: Int!
  longPassing: Int!
  vision: Int!
}

"""
Defensive and recovery skills.
`marking` is nullable - it is absent for some goalkeepers in the source data.
"""
type DefensiveSkills {
  marking: Int # nullable: missing for ~158 GKs in source
  slideTackle: Int!
  standingTackle: Int!
  interceptions: Int!
  aggression: Int!
}

"""Physical and mental attributes that apply to all positions."""
type PhysicalAttributes {
  acceleration: Int!
  sprintSpeed: Int!
  agility: Int!
  balance: Int!
  stamina: Int!
  strength: Int!
  jumping: Int!
  heading: Int!
  reactions: Int!
  composure: Int!
}

"""
Goalkeeper-specific skills.
Outfield players will have low values here (typically 10 - 15).
"""
type GoalkeeperSkills {
  positioning: Int!
  diving: Int!
  handling: Int!
  kicking: Int!
  reflexes: Int!
}

# ---------------------------------------------------------------------------
# Core entity
# ---------------------------------------------------------------------------

"""
A single FIFA-rated football player.

Skill stats are grouped into four shallow sub-objects so callers can
request only the categories they need without fetching all 34 fields.
The nesting is capped at one level - those sub-objects contain only scalars.
"""
type Player {
  id: ID!
  name: String!
  country: String!
  club: String!
  age: Int!

  "Height in centimetres."
  heightCm: Int!

  "Weight in kilograms."
  weightKg: Int!

  "Estimated market value in USD. Null when not available."
  marketValue: Currency

  "Aggregate rating computed server-side from all skill groups."
  overallRating: Int!

  technical: TechnicalSkills!
  defensive: DefensiveSkills!
  physical: PhysicalAttributes!
  goalkeeper: GoalkeeperSkills!
}

# ---------------------------------------------------------------------------
# Pagination - Relay-style cursor connections
# ---------------------------------------------------------------------------

"""
Standard Relay PageInfo. Does NOT include totalCount - that lives on
the Connection itself so it can be calculated independently of page fetching.
"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  "Cursor of the first edge on this page."
  startCursor: Cursor
  "Cursor of the last edge on this page. Pass as `after` to fetch the next page."
  endCursor: Cursor
}

type PlayerEdge {
  "Opaque cursor uniquely identifying this player in the current result set."
  cursor: Cursor!
  node: Player!
}

"""
Paginated list of players. Always use this rather than a plain [Player]
to keep response sizes bounded. `totalCount` reflects the full filtered
set size regardless of the current page.
"""
type PlayerConnection {
  edges: [PlayerEdge!]!
  pageInfo: PageInfo!
  "Total number of players matching the current filter, across all pages."
  totalCount: Int!
  "Outcome metadata for the list operation (always 2xx on a well-formed request)."
  meta: OperationMeta!
}

type ClubEdge {
  cursor: Cursor!
  node: ClubSummary!
}

type ClubConnection {
  edges: [ClubEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
  "Outcome metadata for the list operation."
  meta: OperationMeta!
}

"""
Read-only club summary derived from player data.
Does NOT expose a `players` field - use `Query.players(filter: { clubs: ["..."] })`
to avoid circular nesting.
"""
type ClubSummary {
  name: String!
  country: String!
  playerCount: Int!
  averageAge: Float!
  averageOverallRating: Float!
}

# ---------------------------------------------------------------------------
# Shared range scalars
# ---------------------------------------------------------------------------

"""Inclusive integer range. Omit either bound to leave it open-ended."""
input IntRangeInput {
  min: Int
  max: Int
}

"""Inclusive float range. Used for market value filtering."""
input FloatRangeInput {
  min: Float
  max: Float
}

# ---------------------------------------------------------------------------
# Pagination input
# ---------------------------------------------------------------------------

"""
Cursor-based pagination following the Relay Connection spec.
Use `first` + `after` for forward traversal (most common).
Use `last` + `before` for backward traversal.
Server enforces a maximum page size of 100.
"""
input PaginationInput {
  "Max results to return. Defaults to 20. Server cap: 100."
  first: Int = 20
  "Return results after this cursor (exclusive)."
  after: Cursor
  "Max results to return going backwards."
  last: Int
  "Return results before this cursor (exclusive)."
  before: Cursor
}

# ---------------------------------------------------------------------------
# Sorting inputs
# ---------------------------------------------------------------------------

"""
One sort key. Pass an array of these to `players` or `clubs` to apply
multi-level ordering - e.g. sort by FINISHING DESC, then NAME ASC.
"""
input PlayerSortInput {
  field: PlayerSortField! = OVERALL_RATING
  direction: SortDirection! = DESC
}

input ClubSortInput {
  field: ClubSortField! = PLAYER_COUNT
  direction: SortDirection! = DESC
}

# ---------------------------------------------------------------------------
# Skill-group filter inputs
# ---------------------------------------------------------------------------

"""
Range filters for every technical skill.
All fields are optional; omit a field to apply no constraint on it.
"""
input TechnicalSkillsFilterInput {
  ballControl: IntRangeInput
  dribbling: IntRangeInput
  attackingPosition: IntRangeInput
  finishing: IntRangeInput
  shotPower: IntRangeInput
  longShots: IntRangeInput
  volleys: IntRangeInput
  curve: IntRangeInput
  freeKickAccuracy: IntRangeInput
  penalties: IntRangeInput
  crossing: IntRangeInput
  shortPassing: IntRangeInput
  longPassing: IntRangeInput
  vision: IntRangeInput
}

"""Range filters for defensive skills."""
input DefensiveSkillsFilterInput {
  marking: IntRangeInput
  slideTackle: IntRangeInput
  standingTackle: IntRangeInput
  interceptions: IntRangeInput
  aggression: IntRangeInput
}

"""Range filters for physical attributes."""
input PhysicalAttributesFilterInput {
  acceleration: IntRangeInput
  sprintSpeed: IntRangeInput
  agility: IntRangeInput
  balance: IntRangeInput
  stamina: IntRangeInput
  strength: IntRangeInput
  jumping: IntRangeInput
  heading: IntRangeInput
  reactions: IntRangeInput
  composure: IntRangeInput
}

"""Range filters for goalkeeper skills."""
input GoalkeeperSkillsFilterInput {
  positioning: IntRangeInput
  diving: IntRangeInput
  handling: IntRangeInput
  kicking: IntRangeInput
  reflexes: IntRangeInput
}

# ---------------------------------------------------------------------------
# Top-level player filter
# ---------------------------------------------------------------------------

"""
All filter conditions are combined with AND logic.
Within a skill-group sub-filter, each field is also AND-combined.
Omitting any field means no constraint on that dimension.
"""
input PlayerFilterInput {
  # Identity filters

  "Case-insensitive substring match on player name."
  nameContains: String

  """
  Match any player whose country is in this list.
  Single-country queries: `countries: ["Brazil"]`
  Multi-country queries: `countries: ["Brazil", "Argentina"]`
  """
  countries: [String!]

  """
  Match any player whose club is in this list.
  Single-club queries: `clubs: ["FC Barcelona"]`
  """
  clubs: [String!]

  age: IntRangeInput
  heightCm: IntRangeInput
  weightKg: IntRangeInput
  overallRating: IntRangeInput
  marketValue: FloatRangeInput

  # Skill-group filters

  "Filter on any combination of technical skill ranges."
  technical: TechnicalSkillsFilterInput

  "Filter on any combination of defensive skill ranges."
  defensive: DefensiveSkillsFilterInput

  "Filter on any combination of physical attribute ranges."
  physical: PhysicalAttributesFilterInput

  "Filter on any combination of goalkeeper skill ranges."
  goalkeeper: GoalkeeperSkillsFilterInput
}

# ---------------------------------------------------------------------------
# Club filter
# ---------------------------------------------------------------------------

input ClubFilterInput {
  "Case-insensitive substring match on club name."
  nameContains: String

  "Exact match on country name."
  country: String

  playerCount: IntRangeInput
  averageAge: FloatRangeInput
  averageOverallRating: FloatRangeInput
}

